[workspace]
members = [
    "crates/gtkg-protocol",
    "crates/gtkg-extract",
    "crates/gtkg-core",
    "crates/gtkg-app",
    "crates/gtkg-testkit",
]
default-members = [
    "crates/gtkg-protocol",
    "crates/gtkg-extract",
    "crates/gtkg-core",
    "crates/gtkg-app",
    "crates/gtkg-testkit",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"

[workspace.metadata.gtkg]
product-version = "V0.3"
storage-model = "okf-and-ordinary-files"
database-backend = "none"
release-intent = false

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3.4"
hex = "0.4"
hmac = "=0.12.1"
lopdf = "0.38"
quick-xml = "0.38"
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
toml_edit = "0.25.4"
walkdir = "2.5"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
rustix = { version = "1.1", features = ["fs", "process"] }
syn = { version = "2.0", default-features = false, features = ["full", "visit", "parsing", "printing", "clone-impls"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
tree-sitter = "0.23"
tree-sitter-go = "=0.23.4"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.23"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
